<!DOCTYPE html>
<html>
<head>
    <title>Create Blog</title>
</head>

<body>

    <h1>Create New Blog</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <br>
        <input type="text" name="title" required>

        <br><br>

        <label>Content:</label>
        <br>
        <textarea name="content" rows="10" cols="50" required></textarea>

        <br><br>

        <button type="submit">Create Blog</button>
    </form>

</body>
</html>
