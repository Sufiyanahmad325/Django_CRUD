<!DOCTYPE html>
<html>
  <head>
    <title>Home</title>
  </head>
  <body>
    <h1>Welcome to My Blog</h1>

    <h2>Hello, {{ request.user.username }}</h2>

    <p>You are successfully logged in.</p>

    <a href="{% url 'create_blog' %}">
      <button>Create Blog</button>
    </a>

    {% comment %} blogs {% endcomment %}
    {% for blog in blogs%}
      <h3>{{ blog.title }}</h3>
      <p>{{ blog.content }}</p>

      <a href="{% url 'edit_blog' blog.id %}">
      <button>Edit</button>
      </a>

    {% endfor %}
  </body>
</html>
